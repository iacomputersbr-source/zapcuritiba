<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel - ZapCuritiba</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-black text-white p-6">
<div class="max-w-4xl mx-auto">
<h1 class="text-3xl font-black mb-6">Painel ZapCuritiba - Licencas</h1>
<div class="bg-zinc-900 rounded-2xl p-6 border border-zinc-800 mb-6">
<h2 class="font-bold mb-3">Gerar Nova Licenca</h2>
<input id="cliente" placeholder="Nome do cliente ex: Pizzaria Batel" class="w-full bg-zinc-800 border border-zinc-700 rounded-xl p-3 mb-3 text-white">
<button onclick="gerar()" class="bg-white text-black px-6 py-3 rounded-full font-bold w-full">Gerar Licenca</button>
<p id="result" class="mt-4 text-green-400 font-mono break-all"></p>
</div>
<div id="lista" class="space-y-2"></div>
<a href="/" class="text-zinc-500 underline mt-6 block">← Voltar ao site</a>
</div>
<script>
async function load(){ const r=await fetch('/api/licencias'); const d=await r.json(); document.getElementById('lista').innerHTML=d.map(l=>`<div class='bg-zinc-900 p-4 rounded-xl flex justify-between border border-zinc-800'><span class='font-mono text-sm'>${l.codigo}</span><span class='text-sm'>${l.cliente}</span></div>`).join('')}
async function gerar(){ const cliente=document.getElementById('cliente').value; if(!cliente) return alert('Digite o nome'); const r=await fetch('/api/licencias',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cliente})}); const d=await r.json(); document.getElementById('result').innerText='Licenca criada: '+d.codigo; document.getElementById('cliente').value=''; load();}
load();
</script>
</body></html>

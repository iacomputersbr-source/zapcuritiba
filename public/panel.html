<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel - ZapCuritiba Seguro</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-black text-white p-6"><div class="max-w-4xl mx-auto"><h1 class="text-3xl font-black mb-6">ZapCuritiba - Licencas</h1><div id="loginBox" class="bg-zinc-900 rounded-2xl p-6 border border-zinc-800 mb-6"><h2 class="font-bold mb-3">Login Admin</h2><input id="user" placeholder="Usuario" class="w-full bg-zinc-800 border border-zinc-700 rounded-xl p-3 mb-3 text-white" value="iacomputersbr"><input id="pass" type="password" placeholder="Senha" class="w-full bg-zinc-800 border border-zinc-700 rounded-xl p-3 mb-3 text-white"><button onclick="fazerLogin()" class="bg-white text-black px-6 py-3 rounded-full font-bold w-full">Entrar no Painel</button><p id="loginError" class="mt-3 text-red-400 text-sm"></p></div><div id="panelBox" style="display:none"><div class="bg-zinc-900 rounded-2xl p-6 border border-zinc-800 mb-6"><div class="flex justify-between items-center mb-3"><h2 class="font-bold">Gerar Nova Licenca</h2><button onclick="logout()" class="text-xs text-zinc-400 underline">Sair</button></div><input id="cliente" placeholder="Nome do cliente ex: Pizzaria Batel" class="w-full bg-zinc-800 border border-zinc-700 rounded-xl p-3 mb-3 text-white"><button onclick="gerar()" class="bg-white text-black px-6 py-3 rounded-full font-bold w-full">Gerar Licenca</button><p id="result" class="mt-4 text-green-400 font-mono break-all"></p></div><div id="lista" class="space-y-2"></div></div><a href="/" class="text-zinc-500 underline mt-6 block">← Voltar ao site</a></div><script>let adminUser=localStorage.getItem('zc_user');let adminPass=localStorage.getItem('zc_pass');function showPanel(){document.getElementById('loginBox').style.display='none';document.getElementById('panelBox').style.display='block';load();}function showLogin(){document.getElementById('loginBox').style.display='block';document.getElementById('panelBox').style.display='none';}async function fazerLogin(){const user=document.getElementById('user').value.trim();const pass=document.getElementById('pass').value;if(!user||!pass)return alert('Preencha usuario e senha');const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user,pass})});const d=await r.json();if(d.success){localStorage.setItem('zc_user',user);localStorage.setItem('zc_pass',pass);adminUser=user;adminPass=pass;document.getElementById('loginError').innerText='';showPanel();}else{document.getElementById('loginError').innerText=d.message||'Erro no login';}}function logout(){localStorage.removeItem('zc_user');localStorage.removeItem('zc_pass');adminUser=null;adminPass=null;document.getElementById('user').value='iacomputersbr';document.getElementById('pass').value='';showLogin();}function getHeaders(){return{'Content-Type':'application/json','x-admin-user':adminUser||'','x-admin-pass':adminPass||''};}async function load(){try{const r=await fetch('/api/licencias',{headers:getHeaders()});if(r.status===401){logout();return alert('Sessao expirada - faca login novamente');}const d=await r.json();document.getElementById('lista').innerHTML=d.map(l=>`<div class='bg-zinc-900 p-4 rounded-xl flex justify-between border border-zinc-800'><span class='font-mono text-sm'>${l.codigo}</span><span class='text-sm'>${l.cliente}</span></div>`).join('');}catch(e){document.getElementById('lista').innerHTML='<p class="text-red-400">Erro ao carregar licencas</p>';}}async function gerar(){const cliente=document.getElementById('cliente').value;if(!cliente)return alert('Digite o nome');const r=await fetch('/api/licencias',{method:'POST',headers:getHeaders(),body:JSON.stringify({cliente})});if(r.status===401){logout();return alert('Nao autorizado - faca login');}const d=await r.json();document.getElementById('result').innerText='Licenca criada: '+d.codigo;document.getElementById('cliente').value='';load();}if(adminUser&&adminPass){fetch('/api/licencias',{headers:getHeaders()}).then(r=>{if(r.ok)showPanel();else showLogin();}).catch(()=>showLogin());}else{showLogin();}</script></body></html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ativar - ZapCuritiba</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white min-h-screen flex items-center justify-center p-4">
<div class="max-w-sm w-full">

<div id="step1" class="bg-zinc-900 border border-zinc-800 p-8 rounded-3xl">
<h1 class="text-4xl font-black mb-2">Ativar<br>Licença</h1>
<p class="text-zinc-400 text-sm mb-6">Chave de Curitiba</p>
<input id="key" value="ZC-CUR-2026-BATEL-001" class="w-full bg-black border border-zinc-800 p-4 rounded-xl font-mono text-center mb-4 uppercase">
<button onclick="validar()" class="w-full bg-[#25D366] text-black font-black py-4 rounded-xl">VALIDAR</button>
<p id="msg" class="text-xs text-red-400 mt-3 hidden"></p>
</div>

<div id="step2" class="hidden bg-white text-black p-6 rounded-3xl">
<div class="text-center mb-4">
<div class="text-5xl">✅</div>
<h2 class="text-2xl font-black mt-2">Licença Validada!</h2>
<p class="text-zinc-500 text-sm">Escaneie o QR REAL</p>
</div>

<!-- QR ARRIBA GRANDE -->
<div id="qrBox" class="w-full flex flex-col items-center">
<div class="bg-white border-2 border-black p-3 rounded-2xl w-[300px] h-[300px] flex items-center justify-center">
<p class="animate-pulse text-sm text-zinc-500">Gerando QR...</p>
</div>
</div>

<!-- TEXTO ABAJO -->
<div class="mt-4 text-center">
<p class="text-green-600 font-black text-sm">● QR REAL - Escaneie agora</p>
<p class="text-[11px] text-zinc-400 mt-1">Atualiza a cada 30s automaticamente</p>
</div>

<div class="mt-5 bg-black text-white p-3 rounded-xl font-mono text-[11px]">
> Licença: <span id="licShow"></span><br>
> Status: <span id="connStatus">Aguardando</span><br>
> IA: ATIVA 24h
</div>

<p class="text-[11px] text-zinc-500 mt-3 text-center font-bold">WhatsApp > Aparelhos conectados > Conectar</p>
</div>

</div>

<script>
let interval=null;
function validar(){
  const k=document.getElementById('key').value.trim().toUpperCase();
  if(!k.startsWith('ZC-CUR-')){document.getElementById('msg').textContent='Chave inválida';document.getElementById('msg').classList.remove('hidden');return;}
  document.getElementById('step1').classList.add('hidden');
  document.getElementById('step2').classList.remove('hidden');
  document.getElementById('licShow').textContent=k;
  loadQR();
  interval=setInterval(loadQR,3000);
}
async function loadQR(){
  try{
    const r=await fetch('/api/qr?_='+Date.now());
    const d=await r.json();
    const box=document.getElementById('qrBox');
    const st=document.getElementById('connStatus');
    if(d.connected){
      box.innerHTML='<div class="text-center py-8"><div class="text-6xl mb-2">🎉</div><p class="font-black text-green-600 text-xl">Conectado!</p><p class="text-sm text-zinc-600">IA respondendo 24h</p></div>';
      st.textContent='CONECTADO';
      clearInterval(interval);
    } else if(d.qr){
      box.innerHTML='<div class="bg-white border-2 border-black p-3 rounded-2xl w-[300px] h-[300px] flex items-center justify-center shadow-lg"><img src="'+d.qr+'" style="width:100%;height:100%;object-fit:contain;display:block;" /></div>';
      st.textContent='QR REAL - Escaneie';
    }
  }catch(e){}
}
</script>
</body>
  </html>

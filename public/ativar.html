<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ativar - ZapCuritiba</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white min-h-screen flex items-center justify-center p-6">
<div class="max-w-md w-full">
<div id="step1" class="bg-zinc-900 border border-zinc-800 p-8 rounded-3xl">
<h1 class="text-3xl font-black mb-2">Ativar Licença</h1>
<p class="text-zinc-400 text-sm mb-6">Insira sua chave ZapCuritiba</p>
<input id="key" placeholder="ZC-CUR-2026-..." class="w-full bg-black border border-zinc-800 p-4 rounded-xl font-mono mb-4">
<button onclick="validar()" id="btn" class="w-full bg-green-500 text-black font-black py-4 rounded-xl">VALIDAR CHAVE</button>
<p id="msg" class="text-xs text-red-400 mt-3 hidden"></p>
</div>

<div id="step2" class="hidden bg-white text-black p-8 rounded-3xl text-center">
<div class="text-5xl mb-4">📲</div>
<h2 class="text-2xl font-black mb-2">Conecte seu WhatsApp</h2>
<p class="text-zinc-600 text-sm mb-6">Abra seu WhatsApp > Aparelhos conectados > Conectar aparelho e escaneie:</p>
<div class="bg-black p-4 rounded-2xl mb-6">
<img id="qrcode" src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=ZAPCURITIBA-DEMO-CONNECT" class="mx-auto rounded-xl">
<p class="text-green-400 font-mono text-xs mt-3">Aguardando escaneamento...</p>
</div>
<p class="text-xs text-zinc-500">Após escanear, sua IA começará a responder em 10 segundos. Mantenha o celular conectado à internet.</p>
<button onclick="location.href='/'" class="mt-6 text-xs underline">Voltar ao início</button>
</div>
</div>

<script>
async function validar(){
const key=document.getElementById('key').value.trim();
const btn=document.getElementById('btn');
const msg=document.getElementById('msg');
if(!key){msg.textContent='Digite sua chave';msg.classList.remove('hidden');return;}
btn.textContent='Validando...';
try{
const r=await fetch('/api/validate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key})});
const d=await r.json();
if(d.valid){
document.getElementById('step1').classList.add('hidden');
document.getElementById('step2').classList.remove('hidden');
// Aqui no futuro você vai chamar sua Evolution API para gerar QR real
}else{
msg.textContent='Chave inválida ou expirada. Chame no WhatsApp 41 99729-4355';
msg.classList.remove('hidden');
btn.textContent='VALIDAR CHAVE';
}
}catch(e){
msg.textContent='Erro de conexão. Tente novamente.';
msg.classList.remove('hidden');
btn.textContent='VALIDAR CHAVE';
}
}
</script>
</div>
</body>
  </html>
